<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f1">
  <meta name="description" content="Explore courses and plan your next semester at Northstar University.">
  <title>Northstar University | Course Registration</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="#home" aria-label="Northstar University home"><span class="brand-mark" aria-hidden="true">N</span><span>northstar<span class="brand-sub">UNIVERSITY</span></span></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav"><span class="sr-only">Toggle navigation</span><span aria-hidden="true">☰</span></button>
    <nav id="primary-nav" class="primary-nav" aria-label="Main navigation">
      <a href="#home" data-route="home">Home</a><a href="#catalog" data-route="catalog">Course catalog</a><a href="#registration" data-route="registration">Registration</a><a href="#profile" data-route="profile">My profile</a>
    </nav>
    <a class="avatar-link" href="#profile" aria-label="View student profile">JD</a>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="site-footer"><span>© 2026 Northstar University</span><span>Learn boldly. Go anywhere. <span aria-hidden="true">✳</span></span></footer>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="confirm-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
    <div class="dialog-top"><span class="dialog-icon" aria-hidden="true">✓</span><button class="icon-button" type="button" data-close-dialog aria-label="Close confirmation">×</button></div>
    <h2 id="dialog-title">You're on the list!</h2><p id="dialog-description">Your course registration has been saved to your student profile.</p>
    <div id="dialog-course" class="dialog-course"></div><button class="button button-primary" type="button" data-close-dialog>View my schedule</button>
  </dialog>
</body>
</html>
