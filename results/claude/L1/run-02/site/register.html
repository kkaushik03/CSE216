<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniReg · Registration</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="register">
  <main>
    <section class="page-header" style="--from:#0984e3; --to:#00b894">
      <div class="container">
        <h1>📝 Course Registration</h1>
        <p>Fill in your details, choose your courses, and confirm your registration.</p>
      </div>
    </section>

    <section class="container register-layout">
      <form id="register-form" class="card form-card" novalidate>
        <fieldset>
          <legend><span class="legend-num">1</span> Student Information</legend>
          <div class="form-grid">
            <div class="field">
              <label for="name">Full name *</label>
              <input id="name" name="name" type="text" autocomplete="name" required>
              <small class="field-error"></small>
            </div>
            <div class="field">
              <label for="studentId">Student ID *</label>
              <input id="studentId" name="studentId" type="text" placeholder="S2026-0417" required>
              <small class="field-error"></small>
            </div>
            <div class="field">
              <label for="email">University email *</label>
              <input id="email" name="email" type="email" autocomplete="email" required>
              <small class="field-error"></small>
            </div>
            <div class="field">
              <label for="major">Major *</label>
              <select id="major" name="major" required>
                <option value="">Select major</option>
                <option>Computer Science</option>
                <option>Mathematics</option>
                <option>Biology</option>
                <option>Fine Arts</option>
                <option>Business</option>
                <option>Physics</option>
                <option>English</option>
                <option>Undeclared</option>
              </select>
              <small class="field-error"></small>
            </div>
            <div class="field">
              <label for="year">Academic year *</label>
              <select id="year" name="year" required>
                <option value="">Select year</option>
                <option>Freshman</option>
                <option>Sophomore</option>
                <option>Junior</option>
                <option>Senior</option>
                <option>Graduate</option>
              </select>
              <small class="field-error"></small>
            </div>
            <div class="field">
              <label for="term">Term *</label>
              <select id="term" name="term" required>
                <option value="Fall 2026" selected>Fall 2026</option>
                <option value="Spring 2027">Spring 2027</option>
              </select>
              <small class="field-error"></small>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend><span class="legend-num">2</span> Choose Courses</legend>
          <div class="option-filters">
            <div class="search-box small">
              <label for="reg-search" class="sr-only">Search courses</label>
              <span class="search-icon" aria-hidden="true">🔍</span>
              <input id="reg-search" type="search" placeholder="Filter courses…" autocomplete="off">
            </div>
            <label for="reg-dept" class="sr-only">Department</label>
            <select id="reg-dept"><option value="">All departments</option></select>
          </div>
          <div id="course-options" class="course-options"></div>
          <small class="field-error block" id="courses-error"></small>
        </fieldset>

        <fieldset>
          <legend><span class="legend-num">3</span> Review &amp; Submit</legend>
          <label class="checkbox">
            <input type="checkbox" name="agree">
            <span>I understand the add/drop policy and confirm the information above is accurate.</span>
          </label>
          <small class="field-error block" id="agree-error"></small>
          <div class="form-actions">
            <button type="reset" class="btn btn-ghost">Clear</button>
            <button type="submit" class="btn btn-primary btn-lg">Register Selected Courses →</button>
          </div>
        </fieldset>
      </form>

      <aside class="card summary-card">
        <h3>🧾 Selection Summary</h3>
        <div id="selection-summary"></div>
        <p class="muted small">Maximum load is 18 credits. 12+ credits is full-time.</p>
      </aside>
    </section>

    <section class="container section">
      <div class="section-head">
        <h2>📋 My Registered Courses</h2>
        <a href="profile.html" class="link-arrow">View schedule →</a>
      </div>
      <div id="registered-table" class="card table-card"></div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
