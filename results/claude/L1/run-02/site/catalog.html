<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Catalog · PrismU Course Registration</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="catalog">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
      <a class="brand" href="index.html"><span class="brand-logo" aria-hidden="true">🎓</span><span>Prism<strong>U</strong></span></a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="nav-links" aria-label="Toggle navigation"><span></span><span></span><span></span></button>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html" data-page="home">Home</a></li>
        <li><a href="catalog.html" data-page="catalog">Course Catalog</a></li>
        <li><a href="register.html" data-page="register">Register</a></li>
        <li><a href="profile.html" data-page="profile">My Profile <span class="nav-badge" id="nav-badge" hidden>0</span></a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <section class="page-banner banner-catalog">
      <div class="container">
        <h1>Course Catalog</h1>
        <p>Find the right courses for Spring 2027.</p>
      </div>
    </section>

    <section class="container">
      <div class="toolbar" role="search">
        <div class="field field-search">
          <label for="search">Search</label>
          <input id="search" type="search" placeholder="Title, code, instructor or keyword…" autocomplete="off">
        </div>
        <div class="field">
          <label for="filter-dept">Department</label>
          <select id="filter-dept"></select>
        </div>
        <div class="field">
          <label for="filter-level">Level</label>
          <select id="filter-level">
            <option value="">All levels</option>
            <option value="100">100 – Introductory</option>
            <option value="200">200 – Intermediate</option>
            <option value="300">300 – Advanced</option>
            <option value="400">400 – Senior</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-credits">Credits</label>
          <select id="filter-credits">
            <option value="">Any credits</option>
            <option value="2">2 credits</option>
            <option value="3">3 credits</option>
            <option value="4">4 credits</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-days">Days</label>
          <select id="filter-days">
            <option value="">Any days</option>
            <option value="MWF">Meets Mon / Wed / Fri</option>
            <option value="TR">Meets Tue / Thu</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-availability">Availability</label>
          <select id="filter-availability">
            <option value="">All courses</option>
            <option value="open">Open seats only</option>
            <option value="registered">My registered courses</option>
          </select>
        </div>
        <div class="field">
          <label for="sort">Sort by</label>
          <select id="sort">
            <option value="code">Course code</option>
            <option value="title">Title (A–Z)</option>
            <option value="credits">Credits (high–low)</option>
            <option value="seats">Seats left</option>
          </select>
        </div>
        <div class="field field-btn">
          <button class="btn btn-ghost" id="clear-filters" type="button">Clear filters</button>
        </div>
      </div>

      <p class="result-count" id="result-count" aria-live="polite"></p>
      <div class="course-grid" id="course-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> PrismU Course Registration · Demo application with sample data</p>
  </footer>

  <div class="modal-overlay" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" aria-label="Close dialog">×</button>
      <div class="modal-icon" id="modal-icon" aria-hidden="true">✓</div>
      <h2 id="modal-title">Confirm</h2>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modal-cancel" type="button">Cancel</button>
        <button class="btn btn-primary" id="modal-confirm" type="button">Confirm</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
