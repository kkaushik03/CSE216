<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniReg · Course Catalog</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="catalog">
  <main>
    <section class="page-header" style="--from:#6c5ce7; --to:#e84393">
      <div class="container">
        <h1>📖 Course Catalog</h1>
        <p>Browse every course offered this term. Use search and filters to narrow it down.</p>
      </div>
    </section>

    <section class="container">
      <form class="filter-panel" id="catalog-search" role="search">
        <div class="search-box">
          <label for="search" class="sr-only">Search courses</label>
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input id="search" type="search" placeholder="Search code, title, instructor, keyword…" autocomplete="off">
        </div>
        <div class="filters">
          <div class="filter">
            <label for="filter-dept">Department</label>
            <select id="filter-dept"><option value="">All departments</option></select>
          </div>
          <div class="filter">
            <label for="filter-level">Level</label>
            <select id="filter-level">
              <option value="">All levels</option>
              <option value="100">100 · Introductory</option>
              <option value="200">200 · Intermediate</option>
              <option value="300">300 · Advanced</option>
              <option value="400">400 · Senior</option>
            </select>
          </div>
          <div class="filter">
            <label for="filter-credits">Credits</label>
            <select id="filter-credits">
              <option value="">Any credits</option>
              <option value="3">3 credits</option>
              <option value="4">4 credits</option>
            </select>
          </div>
          <div class="filter">
            <label for="filter-day">Meeting day</label>
            <select id="filter-day">
              <option value="">Any day</option>
              <option value="Mon">Monday</option>
              <option value="Tue">Tuesday</option>
              <option value="Wed">Wednesday</option>
              <option value="Thu">Thursday</option>
              <option value="Fri">Friday</option>
            </select>
          </div>
          <div class="filter">
            <label for="sort">Sort by</label>
            <select id="sort">
              <option value="code">Course code</option>
              <option value="title">Title (A–Z)</option>
              <option value="creditsDesc">Credits (high → low)</option>
              <option value="seats">Most seats available</option>
            </select>
          </div>
        </div>
        <div class="filter-footer">
          <label class="switch">
            <input type="checkbox" id="filter-open">
            <span class="slider" aria-hidden="true"></span>
            Open seats only
          </label>
          <button type="button" class="btn btn-ghost btn-sm" id="reset-filters">↺ Reset filters</button>
        </div>
      </form>

      <div class="results-bar">
        <p id="result-count" class="result-count" aria-live="polite"></p>
        <div id="active-filters" class="active-filters"></div>
      </div>

      <div class="course-grid" id="course-grid"></div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
