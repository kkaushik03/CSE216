<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniReg · Student Profile</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="profile">
  <main>
    <section class="page-header" style="--from:#e84393; --to:#fdcb6e">
      <div class="container">
        <h1>👤 Student Profile</h1>
        <p>Your personal details, enrollment summary, and weekly schedule.</p>
      </div>
    </section>

    <section class="container profile-layout">
      <aside class="card profile-card" id="profile-card"></aside>

      <div class="profile-main">
        <div class="stats mini">
          <div class="stat-card" style="--accent:#6c5ce7"><span class="stat-icon">📚</span><strong id="p-courses">0</strong><span>Courses</span></div>
          <div class="stat-card" style="--accent:#00b894"><span class="stat-icon">🎯</span><strong id="p-credits">0</strong><span>Credits</span></div>
          <div class="stat-card" style="--accent:#0984e3"><span class="stat-icon">➕</span><strong id="p-remaining">0</strong><span>Credits available</span></div>
          <div class="stat-card" style="--accent:#e84393"><span class="stat-icon">🏷️</span><strong id="p-status" class="text-stat">—</strong><span>Status</span></div>
        </div>

        <div class="card">
          <h3>🗓️ Weekly Schedule</h3>
          <div class="weekly-schedule" id="weekly-schedule"></div>
        </div>

        <details class="card edit-card">
          <summary><h3>✏️ Edit Profile</h3></summary>
          <form id="profile-form" class="form-grid" novalidate>
            <div class="field"><label for="p-name">Full name</label><input id="p-name" name="name" type="text" required></div>
            <div class="field"><label for="p-id">Student ID</label><input id="p-id" name="studentId" type="text"></div>
            <div class="field"><label for="p-email">Email</label><input id="p-email" name="email" type="email" required></div>
            <div class="field"><label for="p-phone">Phone</label><input id="p-phone" name="phone" type="tel" placeholder="(555) 123-4567"></div>
            <div class="field">
              <label for="p-major">Major</label>
              <select id="p-major" name="major">
                <option>Computer Science</option><option>Mathematics</option><option>Biology</option><option>Fine Arts</option>
                <option>Business</option><option>Physics</option><option>English</option><option>Undeclared</option>
              </select>
            </div>
            <div class="field">
              <label for="p-year">Academic year</label>
              <select id="p-year" name="year">
                <option>Freshman</option><option>Sophomore</option><option>Junior</option><option>Senior</option><option>Graduate</option>
              </select>
            </div>
            <div class="field"><label for="p-advisor">Advisor</label><input id="p-advisor" name="advisor" type="text"></div>
            <div class="form-actions full">
              <button type="reset" class="btn btn-ghost">Revert</button>
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
          </form>
        </details>
      </div>
    </section>

    <section class="container section">
      <div class="section-head">
        <h2>📋 Registered Courses</h2>
        <a href="register.html" class="link-arrow">Add courses →</a>
      </div>
      <div id="profile-table" class="card table-card"></div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
