<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Catalog · Horizon University</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="catalog">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">
    <section class="page-header catalog-header">
      <div class="container">
        <h1>📖 Course Catalog</h1>
        <p>Find the right courses for your semester.</p>
      </div>
    </section>

    <section class="container">
      <div class="filter-panel" role="search">
        <div class="search-box">
          <span aria-hidden="true">🔍</span>
          <label class="sr-only" for="search">Search courses</label>
          <input id="search" type="search" placeholder="Search by title, code, instructor or keyword…">
        </div>
        <div class="filters">
          <div class="filter">
            <label for="filter-dept">Department</label>
            <select id="filter-dept"><option value="">All</option></select>
          </div>
          <div class="filter">
            <label for="filter-level">Level</label>
            <select id="filter-level">
              <option value="">All</option>
              <option value="100">100 – Introductory</option>
              <option value="200">200 – Intermediate</option>
              <option value="300">300 – Advanced</option>
              <option value="400">400 – Senior</option>
            </select>
          </div>
          <div class="filter">
            <label for="filter-credits">Credits</label>
            <select id="filter-credits">
              <option value="">Any</option>
              <option value="2">2 credits</option>
              <option value="3">3 credits</option>
              <option value="4">4 credits</option>
            </select>
          </div>
          <div class="filter">
            <label for="filter-day">Day</label>
            <select id="filter-day">
              <option value="">Any day</option>
              <option value="Mon">Monday</option>
              <option value="Tue">Tuesday</option>
              <option value="Wed">Wednesday</option>
              <option value="Thu">Thursday</option>
              <option value="Fri">Friday</option>
            </select>
          </div>
          <div class="filter">
            <label for="sort">Sort by</label>
            <select id="sort">
              <option value="code">Course code</option>
              <option value="title">Title (A–Z)</option>
              <option value="credits">Credits (high–low)</option>
              <option value="seats">Seats available</option>
            </select>
          </div>
        </div>
        <div class="filter-footer">
          <label class="checkbox"><input type="checkbox" id="open-only"> Show only courses with open seats</label>
          <div>
            <span id="result-count" class="result-count" aria-live="polite"></span>
            <button id="reset-filters" class="btn btn-ghost btn-sm" type="button">Reset filters</button>
          </div>
        </div>
      </div>

      <div id="course-grid" class="course-grid section"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="footer-year"></span> Horizon University · Office of the Registrar</p>
    <p class="footer-links"><a href="index.html">Home</a><a href="catalog.html">Catalog</a><a href="register.html">Register</a><a href="profile.html">Profile</a></p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
