<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniReg · Course Catalog</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="catalog">
  <header id="site-header"></header>

  <main>
    <section class="page-banner banner-catalog">
      <div class="container">
        <h1>Course Catalog</h1>
        <p>Find the right courses for your Spring 2027 semester.</p>
      </div>
    </section>

    <section class="container section">
      <div class="filter-panel">
        <form id="search-form" class="search-box" role="search">
          <label for="search" class="sr-only">Search courses</label>
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input id="search" type="search" placeholder="Search by title, code, instructor or keyword…" autocomplete="off">
        </form>
        <div class="filters">
          <div class="field">
            <label for="filter-dept">Department</label>
            <select id="filter-dept"><option value="">All departments</option></select>
          </div>
          <div class="field">
            <label for="filter-level">Level</label>
            <select id="filter-level"><option value="">All levels</option></select>
          </div>
          <div class="field">
            <label for="filter-credits">Credits</label>
            <select id="filter-credits"><option value="">Any credits</option></select>
          </div>
          <div class="field">
            <label for="filter-availability">Availability</label>
            <select id="filter-availability">
              <option value="">All courses</option>
              <option value="open">Open seats only</option>
              <option value="registered">My registered courses</option>
            </select>
          </div>
          <div class="field">
            <label for="sort">Sort by</label>
            <select id="sort">
              <option value="code">Course code</option>
              <option value="title">Title (A–Z)</option>
              <option value="credits">Credits (high–low)</option>
              <option value="seats">Seats available</option>
            </select>
          </div>
          <button type="button" class="btn btn-ghost reset-btn" id="reset-filters">Reset</button>
        </div>
      </div>

      <p class="result-count" id="result-count" aria-live="polite"></p>
      <div class="course-grid" id="course-grid"></div>
      <div class="empty-state" id="empty-state" hidden>
        <div class="empty-emoji" aria-hidden="true">🔭</div>
        <h2>No courses found</h2>
        <p>Try a different search term or reset the filters.</p>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
