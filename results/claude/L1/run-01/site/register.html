<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniReg · Registration</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="register">
  <header id="site-header"></header>

  <main>
    <section class="page-banner banner-register">
      <div class="container">
        <h1>Course Registration</h1>
        <p>Fill in your details, choose your courses and confirm.</p>
      </div>
    </section>

    <section class="container section register-layout">
      <form id="register-form" class="card form-card" novalidate>
        <fieldset>
          <legend><span class="legend-num">1</span> Student information</legend>
          <div class="form-grid">
            <div class="field">
              <label for="name">Full name *</label>
              <input id="name" name="name" type="text" autocomplete="name" required>
              <small class="error-msg" id="name-error"></small>
            </div>
            <div class="field">
              <label for="studentId">Student ID *</label>
              <input id="studentId" name="studentId" type="text" required>
              <small class="error-msg" id="studentId-error"></small>
            </div>
            <div class="field">
              <label for="email">Email *</label>
              <input id="email" name="email" type="email" autocomplete="email" required>
              <small class="error-msg" id="email-error"></small>
            </div>
            <div class="field">
              <label for="major">Major *</label>
              <select id="major" name="major" required>
                <option value="">Choose…</option>
                <option>Computer Science</option>
                <option>Mathematics</option>
                <option>Physics</option>
                <option>Biology</option>
                <option>English</option>
                <option>Art &amp; Design</option>
                <option>Business</option>
                <option>Undeclared</option>
              </select>
              <small class="error-msg" id="major-error"></small>
            </div>
            <div class="field">
              <label for="year">Year *</label>
              <select id="year" name="year" required>
                <option value="">Choose…</option>
                <option>Freshman</option>
                <option>Sophomore</option>
                <option>Junior</option>
                <option>Senior</option>
                <option>Graduate</option>
              </select>
              <small class="error-msg" id="year-error"></small>
            </div>
            <div class="field">
              <label for="term">Term *</label>
              <select id="term" name="term" required>
                <option value="">Choose…</option>
                <option selected>Spring 2027</option>
                <option>Summer 2027</option>
                <option>Fall 2027</option>
              </select>
              <small class="error-msg" id="term-error"></small>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend><span class="legend-num">2</span> Choose courses</legend>
          <div class="picker-tools">
            <label for="picker-search" class="sr-only">Filter course list</label>
            <input id="picker-search" type="search" placeholder="Filter courses…">
            <label for="picker-dept" class="sr-only">Filter by department</label>
            <select id="picker-dept"><option value="">All departments</option></select>
          </div>
          <div class="course-options" id="course-options"></div>
          <small class="error-msg" id="course-error" aria-live="polite"></small>
        </fieldset>

        <fieldset>
          <legend><span class="legend-num">3</span> Finish up</legend>
          <div class="field">
            <label for="notes">Notes for your advisor (optional)</label>
            <textarea id="notes" name="notes" rows="3" placeholder="Anything your advisor should know?"></textarea>
          </div>
          <div class="field checkbox-field">
            <label><input type="checkbox" name="agree" id="agree"> I confirm I meet the prerequisites and accept the registration policy. *</label>
            <small class="error-msg" id="agree-error"></small>
          </div>
        </fieldset>

        <div class="form-actions">
          <button type="reset" class="btn btn-ghost">Clear</button>
          <button type="submit" class="btn btn-primary">Review &amp; Register</button>
        </div>
      </form>

      <aside class="card summary-card" aria-label="Registration summary">
        <h2>Your selection</h2>
        <ul class="summary-list" id="summary-list"></ul>
        <div class="credit-box">
          <div class="credit-head"><span>Total credits (incl. registered)</span><strong id="summary-credits">0 / 18</strong></div>
          <div class="meter"><span id="credit-meter"></span></div>
          <small class="muted">Maximum load is 18 credits per term.</small>
        </div>
        <a href="catalog.html" class="link-arrow">← Back to catalog</a>
      </aside>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
